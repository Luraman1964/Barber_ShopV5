<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#111111" />
  <title>BarberPro | Reservas & Gestión</title>
  <style>
    :root {
      --bg: #0f0f11;
      --card: #18181c;
      --card-hover: #222228;
      --gold: #d4af37;
      --gold-dark: #b59224;
      --text: #f5f5f7;
      --muted: #9ca3af;
      --danger: #ef4444;
      --success: #10b981;
      --border: #2a2a32;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding-bottom: 80px; }
    
    /* Header & Mode Switcher */
    header {
      background: linear-gradient(180deg, #1c1c21 0%, #0f0f11 100%);
      padding: 18px 16px;
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 50;
    }
    .header-top { display: flex; justify-content: space-between; align-items: center; max-width: 600px; margin: 0 auto; }
    .brand h1 { font-size: 1.25rem; color: var(--gold); letter-spacing: 0.5px; }
    .brand p { font-size: 0.78rem; color: var(--muted); }
    
    .role-switch {
      display: flex; background: #000; border: 1px solid var(--border); border-radius: 20px; padding: 3px;
    }
    .role-btn {
      background: transparent; border: none; color: var(--muted); padding: 6px 12px;
      font-size: 0.78rem; font-weight: 600; border-radius: 16px; cursor: pointer; transition: 0.2s;
    }
    .role-btn.active { background: var(--gold); color: #000; }

    .container { max-width: 600px; margin: 0 auto; padding: 16px; }
    
    /* Promo Banner */
    .promo-banner {
      background: linear-gradient(135deg, rgba(212,175,55,0.18), rgba(212,175,55,0.05));
      border: 1px solid rgba(212,175,55,0.4);
      border-radius: 12px; padding: 14px; margin-bottom: 20px;
      display: flex; align-items: center; gap: 12px;
    }
    .promo-badge { background: var(--gold); color: #000; font-weight: 800; font-size: 0.7rem; padding: 4px 8px; border-radius: 6px; text-transform: uppercase; }
    .promo-text { font-size: 0.88rem; line-height: 1.3; }

    /* Sections & Cards */
    h2 { font-size: 1rem; margin: 18px 0 10px; color: var(--gold); text-transform: uppercase; letter-spacing: 0.8px; }
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 12px;
      padding: 14px; margin-bottom: 10px; transition: 0.2s;
    }
    .service-item { display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
    .service-item.selected { border-color: var(--gold); background: rgba(212,175,55,0.08); }
    .service-info h3 { font-size: 0.98rem; margin-bottom: 3px; }
    .service-info span { font-size: 0.8rem; color: var(--muted); }
    .service-price { font-weight: 700; color: var(--gold); font-size: 1rem; }

    /* Barbers Grid */
    .barbers-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; }
    .barber-card {
      background: var(--card); border: 1px solid var(--border); border-radius: 12px;
      padding: 12px 8px; text-align: center; cursor: pointer;
    }
    .barber-card.selected { border-color: var(--gold); background: rgba(212,175,55,0.1); }
    .avatar {
      width: 44px; height: 44px; border-radius: 50%; background: #2c2c35; color: var(--gold);
      display: flex; align-items: center; justify-content: center; font-weight: bold; margin: 0 auto 8px; font-size: 1.1rem;
    }
    .barber-card p { font-size: 0.85rem; font-weight: 600; }
    .barber-card small { font-size: 0.72rem; color: var(--muted); }

    /* Inputs & Time Slots */
    input, select {
      width: 100%; background: #121215; border: 1px solid var(--border); color: var(--text);
      padding: 12px; border-radius: 10px; font-size: 0.95rem; margin-bottom: 10px; outline: none;
    }
    input:focus { border-color: var(--gold); }
    
    .slots-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 8px; }
    .slot {
      background: var(--card); border: 1px solid var(--border); color: var(--text);
      padding: 10px 4px; border-radius: 8px; text-align: center; font-size: 0.85rem; cursor: pointer;
    }
    .slot.selected { background: var(--gold); color: #000; font-weight: 700; border-color: var(--gold); }
    .slot.booked {
      background: #141417; color: #4b5563; border-color: #1f1f24;
      text-decoration: line-through; cursor: not-allowed;
    }

    /* Buttons */
    .btn {
      width: 100%; background: var(--gold); color: #000; border: none; padding: 14px;
      border-radius: 10px; font-weight: 700; font-size: 0.98rem; cursor: pointer; margin-top: 10px;
    }
    .btn:active { transform: scale(0.99); }
    .btn-outline { background: transparent; border: 1px solid var(--gold); color: var(--gold); }
    .btn-danger { background: rgba(239,68,68,0.15); color: var(--danger); border: 1px solid var(--danger); padding: 6px 10px; font-size: 0.78rem; width: auto; margin-top: 0; }
    .btn-success { background: rgba(16,185,129,0.15); color: var(--success); border: 1px solid var(--success); padding: 6px 10px; font-size: 0.78rem; width: auto; margin-top: 0; }

    /* Admin Specific */
    .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 16px; }
    .stat-box { background: var(--card); border: 1px solid var(--border); padding: 12px; border-radius: 10px; text-align: center; }
    .stat-box strong { display: block; font-size: 1.2rem; color: var(--gold); }
    .stat-box span { font-size: 0.72rem; color: var(--muted); }
    
    .appt-card { border-left: 4px solid var(--gold); }
    .appt-card.cancelada { border-left-color: var(--danger); opacity: 0.6; }
    .appt-card.completada { border-left-color: var(--success); }
    .appt-header { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 0.9rem; }
    .appt-actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }

    .hidden { display: none !important; }
    .tabs { display: flex; gap: 8px; margin-bottom: 14px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
    .tab-btn { background: var(--card); border: 1px solid var(--border); color: var(--muted); padding: 8px 12px; border-radius: 8px; font-size: 0.82rem; cursor: pointer; }
    .tab-btn.active { border-color: var(--gold); color: var(--gold); }
  </style>
</head>
<body>

<header>
  <div class="header-top">
    <div class="brand">
      <h1 id="shopTitle">ROYAL BARBER STUDIO</h1>
      <p id="shopSubtitle">Estilo, precisión y puntualidad</p>
    </div>
    <div class="role-switch">
      <button class="role-btn active" id="btnViewClient" onclick="switchRole('client')">Cliente</button>
      <button class="role-btn" id="btnViewAdmin" onclick="switchRole('admin')">Dueño</button>
    </div>
  </div>
</header>

<!-- ==================== VISTA CLIENTE ==================== -->
<main id="clientView" class="container">
  <div class="promo-banner" id="promoBox">
    <span class="promo-badge">PROMO</span>
    <div class="promo-text" id="promoDisplay">Cargando promoción...</div>
  </div>

  <h2>1. Elige tu Servicio</h2>
  <div id="clientServicesList"></div>

  <h2>2. Selecciona tu Barbero</h2>
  <div class="barbers-grid" id="clientBarbersList"></div>

  <h2>3. Fecha y Hora Disponible</h2>
  <input type="date" id="bookingDate" onchange="renderTimeSlots()" />
  <div class="slots-grid" id="timeSlotsGrid"></div>

  <h2>4. Tus Datos para la Reserva</h2>
  <input type="text" id="clientName" placeholder="Tu nombre completo" />
  <input type="tel" id="clientPhone" placeholder="Tu número de WhatsApp (ej. 3001234567)" />

  <button class="btn" onclick="confirmBooking()">Confirmar Cita y Enviar por WhatsApp</button>
</main>

<!-- ==================== VISTA ADMINISTRADOR (DUEÑO) ==================== -->
<main id="adminView" class="container hidden">
  <div class="stats-row">
    <div class="stat-box"><strong id="statToday">0</strong><span>Citas Hoy</span></div>
    <div class="stat-box"><strong id="statActive">0</strong><span>Activas</span></div>
    <div class="stat-box"><strong id="statRevenue">$0</strong><span>Estimado</span></div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchAdminTab('agenda', this)">Agenda</button>
    <button class="tab-btn" onclick="switchAdminTab('services', this)">Servicios</button>
    <button class="tab-btn" onclick="switchAdminTab('barbers', this)">Barberos</button>
    <button class="tab-btn" onclick="switchAdminTab('config', this)">Negocio</button>
  </div>

  <!-- TAB 1: AGENDA -->
  <section id="tab-agenda">
    <div style="display:flex; gap:8px; margin-bottom:12px;">
      <input type="date" id="adminFilterDate" onchange="renderAdminAgenda()" style="margin-bottom:0;" />
      <button class="btn btn-outline" style="width:auto; margin-top:0; padding:0 14px;" onclick="document.getElementById('adminFilterDate').value=''; renderAdminAgenda();">Todas</button>
    </div>
    <div id="adminAppointmentsList"></div>
  </section>

  <!-- TAB 2: SERVICIOS -->
  <section id="tab-services" class="hidden">
    <div class="card">
      <h3 style="font-size:0.9rem; margin-bottom:8px; color:var(--gold);">Agregar Nuevo Servicio</h3>
      <input type="text" id="newSrvName" placeholder="Nombre (ej. Corte + Barba)" />
      <div style="display:flex; gap:8px;">
        <input type="number" id="newSrvPrice" placeholder="Precio (ej. 25000)" />
        <input type="number" id="newSrvDuration" placeholder="Minutos (ej. 45)" />
      </div>
      <button class="btn" onclick="addService()">+ Guardar Servicio</button>
    </div>
    <div id="adminServicesList"></div>
  </section>

  <!-- TAB 3: BARBEROS -->
  <section id="tab-barbers" class="hidden">
    <div class="card">
